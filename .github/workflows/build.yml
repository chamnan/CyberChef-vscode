name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch CyberChef build
        run: npm run fetch-cyberchef
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm test

      - name: Package extension
        run: npx vsce package --no-dependencies --out cyberchef-vscode.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        with:
          name: cyberchef-vscode-vsix
          path: cyberchef-vscode.vsix

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: cyberchef-vscode.vsix
          generate_release_notes: true

      # Requires the repository secret VSCE_PAT (Azure DevOps PAT with Marketplace > Manage scope).
      # Skipped with a notice when the secret is not configured.
      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::VSCE_PAT secret not set - skipping Marketplace publish"
            exit 0
          fi
          npx vsce publish --no-dependencies --packagePath cyberchef-vscode.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
